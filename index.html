<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tic Tac Toe Game</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Main content of the application -->
    <main>
        <h1>Tic Tac Toe</h1>

        <p>Click a cell to play!</p>

        <!-- Tic Tac Toe game area -->
        <section aria-label="Tic Tac Toe game board">

            <h2>Game Board</h2>

            <!--
                The game board contains 9 cells.
                Game logic will be added with JavaScript later.
            -->
            <div class="game-board">

                <button class="cell" aria-label="Cell 1"></button>
                <button class="cell" aria-label="Cell 2"></button>
                <button class="cell" aria-label="Cell 3"></button>

                <button class="cell" aria-label="Cell 4"></button>
                <button class="cell" aria-label="Cell 5"></button>
                <button class="cell" aria-label="Cell 6"></button>

                <button class="cell" aria-label="Cell 7"></button>
                <button class="cell" aria-label="Cell 8"></button>
                <button class="cell" aria-label="Cell 9"></button>

            </div>
        </section>
    </main>

    <!-- Connect the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
